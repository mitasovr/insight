name: slack
# 2026.6.0: connections carry destinationSyncMode append_dedup with
#   primaryKey unique_key, so the Airbyte destination owns the bronze table
#   shape and the RMT promotion step is gone (#2877). MINOR per ADR-0015:
#   reconcile must republish this connector so the connection catalog is
#   refreshed; nothing already stored changes meaning.
# 2027.0.0 (major): the chat feeder drops guest accounts.
#   MAJOR so reconcile dispatches the one-shot `dbt --full-refresh` that purges
#   rows materialised before the filter — incremental models never retro-delete.
# 2027.1.0: Python CDK instead of a declarative manifest, so a day Slack refuses
#   with {"ok": false} fails the sync instead of landing as an all-NULL row.
#   Same stream, schema, unique_key and {"date"} state: reconcile migrates the
#   definition and restores the connection state; bronze keeps its meaning.
#   Staging drops a row with a NULL message counter instead of reading it as 0
#   (none exist on vz, so no full refresh is needed).
version: "2027.1.0"
type: cdk
schedule: 0 4 * * *
# images.cdk.image stays empty until the first main build of build-images.yml,
# whose bump-descriptors job pins it; reconcile skips the connector until then.
images:
  cdk:
    name: source-slack-insight
    dockerfile: ./Dockerfile
    context: .
    image: ""
dbt_select: tag:slack+
workflow: sync
connection:
  namespace: bronze_slack
secret:
  required_fields:
    - slack_bot_token
    - slack_start_date

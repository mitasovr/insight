[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "source-slack"
version = "0.1.0"
description = "Airbyte source connector for Slack member analytics (admin.analytics.getFile, CDK)"
requires-python = ">=3.12"
dependencies = [
    "airbyte-cdk>=7.16.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.11",
]

[project.scripts]
source-slack = "source_slack.source:main"

[tool.uv]
# Do not resolve a version published in the last week: a freshly pushed release is
# where a compromised maintainer account shows up first.
exclude-newer = "7 days"
# airbyte-cdk pins nltk==3.9.4; the image installs 3.10.4 over it (see Dockerfile),
# so keep the resolved dependency graph on the same version.
override-dependencies = ["nltk>=3.10.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["source_slack*"]

[tool.setuptools.package-data]
"source_slack" = ["spec.json", "schemas/*.json"]

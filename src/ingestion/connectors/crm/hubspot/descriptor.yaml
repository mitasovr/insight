name: hubspot
# MAJOR per ADR-0015: the one-shot dbt --full-refresh it dispatches is what
#   fills the new class_crm_* columns for rows stored before them.
version: "3.1.0"
type: cdk
schedule: "0 6 * * *"
workflow: sync
# CI build metadata + runtime image refs (ADR-0016). CI scans `images:`
# via dynamic discovery on every run; reconcile reads images.cdk.image
# when registering the Airbyte CDK source definition.
images:
  cdk:
    name: source-hubspot-insight
    dockerfile: ./Dockerfile
    context: .
    image: "ghcr.io/constructorfabric/source-hubspot-insight:2026.11.09.20.33-ec6cb2a"
dbt_select: "tag:hubspot+"
connection:
  namespace: "bronze_hubspot"
secret:
  required_fields:
    - hubspot_access_token
